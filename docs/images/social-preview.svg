<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1640"/>
      <stop offset="1" stop-color="#0B0A1F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.22" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#6C5CE7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <rect width="1280" height="640" fill="url(#halo)"/>
  <svg x="70" y="150" width="340" height="340" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2F8F"/>
      <stop offset="0.55" stop-color="#2A1F6B"/>
      <stop offset="1" stop-color="#140F3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2FD3FF"/>
      <stop offset="0.5" stop-color="#7FE7FF"/>
      <stop offset="1" stop-color="#1FA6E8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1688D0"/>
      <stop offset="0.45" stop-color="#3CC4F5"/>
      <stop offset="1" stop-color="#0E6FB5"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- squircle tile, inset like macOS app icons -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  <!-- database: three tiers -->
  <g filter="url(#shadow)">
    <path d="M300 640 v70 c0 46 95 84 212 84 s212-38 212-84 v-70 c0 46-95 84-212 84 s-212-38-212-84z" fill="url(#side)"/>
    <path d="M300 520 v70 c0 46 95 84 212 84 s212-38 212-84 v-70 c0 46-95 84-212 84 s-212-38-212-84z" fill="url(#side)"/>
    <path d="M300 400 v70 c0 46 95 84 212 84 s212-38 212-84 v-70 c0 46-95 84-212 84 s-212-38-212-84z" fill="url(#side)"/>
    <ellipse cx="512" cy="400" rx="212" ry="84" fill="url(#disc)"/>
    <ellipse cx="512" cy="392" rx="150" ry="46" fill="#FFFFFF" fill-opacity="0.22"/>
  </g>
  <!-- tier gaps -->
  <path d="M300 520 c0 46 95 84 212 84 s212-38 212-84" fill="none" stroke="#140F3A" stroke-opacity="0.55" stroke-width="10"/>
  <path d="M300 640 c0 46 95 84 212 84 s212-38 212-84" fill="none" stroke="#140F3A" stroke-opacity="0.55" stroke-width="10"/>
  <!-- query accent: a run arrow -->
  <g filter="url(#shadow)">
    <circle cx="726" cy="728" r="118" fill="url(#spark)"/>
    <path d="M690 668 L790 728 L690 788 Z" fill="#FFFFFF"/>
  </g>
  </svg>
  <g font-family="SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="450" y="268" font-size="92" font-weight="800" fill="#FFFFFF">MyDB IDE</text>
    <text x="452" y="330" font-size="34" font-weight="500" fill="#C9C3FF">Free, open-source desktop database IDE</text>
    <text x="452" y="378" font-size="26" fill="#9A94C8">Schema-aware SQL · safe data editing · schema compare</text>
    <g font-size="22" font-weight="600">
      <rect x="452" y="418" width="150" height="44" rx="22" fill="#336791"/><text x="527" y="447" text-anchor="middle" fill="#fff">PostgreSQL</text>
      <rect x="614" y="418" width="104" height="44" rx="22" fill="#00758F"/><text x="666" y="447" text-anchor="middle" fill="#fff">MySQL</text>
      <rect x="730" y="418" width="122" height="44" rx="22" fill="#C0765A"/><text x="791" y="447" text-anchor="middle" fill="#fff">MariaDB</text>
      <rect x="864" y="418" width="106" height="44" rx="22" fill="#0F80CC"/><text x="917" y="447" text-anchor="middle" fill="#fff">SQLite</text>
    </g>
    <text x="452" y="540" font-size="22" fill="#7F7AA8">github.com/taeyun1215/mydb-ide  ·  macOS · Windows · Linux</text>
  </g>
</svg>
