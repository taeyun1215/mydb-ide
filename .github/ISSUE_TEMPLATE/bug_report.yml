name: Bug report
description: Something does not work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove host names, user names, passwords and any other private data from everything you paste below.
  - type: input
    id: version
    attributes:
      label: MyDB IDE version
      description: "About window → Copy and Close, then paste the first line"
      placeholder: "MyDB IDE 2026.2.4, Build #MD-262.10968"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Windows (ARM64)
        - Linux (x64)
        - Linux (ARM64)
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - SQLite
        - Not database specific
    validations:
      required: true
  - type: input
    id: db-version
    attributes:
      label: Database version
      placeholder: "PostgreSQL 17.2"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, ideally with a schema or query that shows the problem
      placeholder: |
        1. Open a console for a PostgreSQL data source
        2. Run `select ...`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots are welcome
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Help → Show Log in Finder/Explorer, the lines around the error"
      render: text
